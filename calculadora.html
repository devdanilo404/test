<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: min(92vw, 360px);
      background: #111827;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    #display {
      width: 100%;
      height: 72px;
      border: none;
      border-radius: 12px;
      background: #e5e7eb;
      color: #111827;
      font-size: 2rem;
      text-align: right;
      padding: 0 16px;
      margin-bottom: 16px;
    }

    .box-button {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      height: 58px;
      font-size: 1.2rem;
      cursor: pointer;
      background: #374151;
      color: white;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .clear, .delete, .equal {
      background: #f59e0b;
      color: #111827;
      font-weight: bold;
    }

    .equal {
      grid-column: span 2;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      text-align: center;
      width: 100%;
      color: #fbbf24;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div>
    <div class="calculator">
      <input type="text" id="display" disabled />
      <div class="box-button">
        <button class="clear" type="button">C</button>
        <button class="delete" type="button">⌫</button>
        <button type="button" data-value="/">/</button>
        <button type="button" data-value="*">*</button>

        <button type="button" data-value="7">7</button>
        <button type="button" data-value="8">8</button>
        <button type="button" data-value="9">9</button>
        <button type="button" data-value="-">-</button>

        <button type="button" data-value="4">4</button>
        <button type="button" data-value="5">5</button>
        <button type="button" data-value="6">6</button>
        <button type="button" data-value="+">+</button>

        <button type="button" data-value="1">1</button>
        <button type="button" data-value="2">2</button>
        <button type="button" data-value="3">3</button>
        <button class="equal" type="button">=</button>

        <button type="button" data-value="0" style="grid-column: span 2;">0</button>
        <button type="button" data-value=".">.</button>
      </div>
    </div>
    <a class="back-link" href="index.html">Voltar ao início</a>
  </div>

  <script>
    const display = document.getElementById('display');
    let expression = '';

    function updateDisplay() {
      display.value = expression || '0';
    }

    document.querySelectorAll('button').forEach((button) => {
      button.addEventListener('click', () => {
        const value = button.dataset.value || button.textContent.trim();

        if (button.classList.contains('clear')) {
          expression = '';
          updateDisplay();
          return;
        }

        if (button.classList.contains('delete')) {
          expression = expression.slice(0, -1);
          updateDisplay();
          return;
        }

        if (button.classList.contains('equal')) {
          try {
            const sanitized = expression.replace(/,/g, '.');
            const result = Function(`"use strict"; return (${sanitized})`)();
            expression = Number.isFinite(result) ? String(result).replace('.', ',') : 'Erro';
          } catch {
            expression = 'Erro';
          }
          updateDisplay();
          return;
        }

        if (['+', '-', '*', '/', '.'].includes(value)) {
          const last = expression.slice(-1);
          if (['+', '-', '*', '/','.'].includes(last) && ['+', '-', '*', '/', '.'].includes(value)) {
            expression = expression.slice(0, -1) + value;
          } else {
            expression += value;
          }
          updateDisplay();
          return;
        }

        expression += value;
        updateDisplay();
      });
    });

    updateDisplay();
  </script>
</body>
</html>
